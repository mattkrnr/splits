name: Garmin sync

on:
  schedule:
    - cron: "23 10 * * *"   # every day at 10:23 UTC (5:23 AM Eastern, 6:23 AM in summer)
  workflow_dispatch:
    inputs:
      days:
        description: "Days of activities to pull (2200 = about 6 years)"
        default: "3"
      sleep_days:
        description: "Days of sleep to pull (blank = same as above, max 365; 0 = skip)"
        default: ""

permissions:
  contents: read

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Garmin and write to Supabase
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          SPLITS_SYNC_TOKEN: ${{ secrets.SPLITS_SYNC_TOKEN }}
          SYNC_DAYS: ${{ github.event.inputs.days || '3' }}
          SLEEP_DAYS: ${{ github.event.inputs.sleep_days || '' }}
        run: python sync/garmin_sync.py
